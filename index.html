<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShiftPvP — 200 Members</title>
<style>
  :root{
    --bg:#07070b;
    --text:#f5f5f7;
    --muted:#8d8d9f;
    --cyan:#00e5ff;
    --pink:#ff2e6e;
    --line:rgba(255,255,255,.08);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
  }

  body{
    background:
      radial-gradient(circle at 50% 45%, rgba(0,229,255,.07), transparent 30%),
      radial-gradient(circle at 50% 55%, rgba(255,46,110,.06), transparent 38%),
      var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size:42px 42px;
  }

  .screen{
    width:100vw;
    height:100vh;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:30px;
  }

  .content{
    width:min(900px,94vw);
    text-align:center;
    position:relative;
    z-index:2;
  }

  .brand{
    font-size:14px;
    font-weight:800;
    letter-spacing:.28em;
    margin-bottom:38px;
    color:#fff;
  }

  .brand span{color:var(--pink)}

  .status{
    display:inline-flex;
    align-items:center;
    gap:9px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:24px;
  }

  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 14px var(--cyan);
    animation:pulse 1.7s infinite;
  }

  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.35;transform:scale(.7)}
  }

  h1{
    font-size:clamp(38px,7vw,82px);
    line-height:1;
    font-weight:900;
    letter-spacing:-.045em;
    margin-bottom:22px;
  }

  .subtitle{
    color:var(--muted);
    font-size:clamp(15px,2vw,19px);
    margin-bottom:48px;
  }

  .counter{
    font-size:clamp(70px,15vw,150px);
    line-height:.9;
    font-weight:900;
    letter-spacing:-.06em;
    margin-bottom:16px;
  }

  .counter .current{
    background:linear-gradient(90deg,var(--cyan),#fff,var(--pink));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .goal{
    color:var(--muted);
    font-size:14px;
    font-family:monospace;
    letter-spacing:.08em;
    margin-bottom:34px;
  }

  .bar{
    width:min(720px,88vw);
    height:8px;
    margin:0 auto 15px;
    background:rgba(255,255,255,.08);
    border-radius:999px;
    overflow:hidden;
    border:1px solid var(--line);
  }

  .fill{
    width:0%;
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg,var(--cyan),var(--pink));
    box-shadow:0 0 22px rgba(0,229,255,.35);
    transition:width .7s ease;
  }

  .progress-text{
    color:#666678;
    font-size:11px;
    font-family:monospace;
    letter-spacing:.08em;
  }

  .message{
    margin-top:55px;
    font-size:clamp(16px,2.2vw,22px);
    font-weight:700;
    line-height:1.5;
  }

  .message span{
    color:var(--cyan);
  }

  .invite{
    display:inline-flex;
    margin-top:28px;
    padding:12px 20px;
    border:1px solid var(--line);
    border-radius:4px;
    color:#aaaabd;
    font-family:monospace;
    font-size:11px;
    letter-spacing:.04em;
    text-decoration:none;
    transition:.2s;
  }

  .invite:hover{
    color:#fff;
    border-color:var(--cyan);
    box-shadow:0 0 22px rgba(0,229,255,.12);
  }

  .error{
    margin-top:14px;
    color:#666678;
    font:10px monospace;
    display:none;
  }

  @media(max-width:600px){
    .screen{padding:20px}
    .brand{margin-bottom:28px}
    .subtitle{margin-bottom:35px}
    .message{margin-top:42px}
  }
</style>
</head>

<body>
<div class="screen">
  <main class="content">
    <div class="brand">SHIFT<span>PVP</span></div>

    <div class="status">
      <span class="dot"></span>
      MEMBER TRACKER — LIVE
    </div>

    <h1>We're waiting for you.</h1>

    <p class="subtitle">ShiftPvP SMP releases when the Discord reaches 200 members.</p>

    <div class="counter">
      <span class="current" id="members">—</span>
    </div>

    <div class="goal">CURRENT MEMBERS / 200</div>

    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>

    <div class="progress-text" id="progress">CONNECTING TO DISCORD...</div>

    <div class="message">
      Release on <span>200 members.</span><br>
      Stay tuned. Invite your friends.....
    </div>

    <a class="invite"
       href="https://discord.gg/DJJsX9mqXd"
       target="_blank"
       rel="noopener noreferrer">
      discord.gg/DJJsX9mqXd
    </a>

    <div class="error" id="error">
      Unable to update member count. Retrying...
    </div>
  </main>
</div>

<script>
  const INVITE_CODE = "DJJsX9mqXd";
  const TARGET = 200;

  const membersEl = document.getElementById("members");
  const fillEl = document.getElementById("fill");
  const progressEl = document.getElementById("progress");
  const errorEl = document.getElementById("error");

  async function updateMembers(){
    try{
      const response = await fetch(
        `https://discord.com/api/v10/invites/${INVITE_CODE}?with_counts=true`,
        {cache:"no-store"}
      );

      if(!response.ok) throw new Error("Discord API error");

      const data = await response.json();
      const members = Number(data.approximate_member_count);

      if(!Number.isFinite(members)) throw new Error("No member count");

      membersEl.textContent = members.toLocaleString();

      const percentage = Math.min((members / TARGET) * 100, 100);
      fillEl.style.width = percentage + "%";

      if(members >= TARGET){
        progressEl.textContent = "200 MEMBERS REACHED — RELEASE READY";
        document.querySelector(".status").innerHTML =
          '<span class="dot"></span> RELEASE UNLOCKED';
      }else{
        progressEl.textContent =
          `${percentage.toFixed(1)}% OF THE WAY TO RELEASE`;
      }

      errorEl.style.display = "none";
    }catch(error){
      errorEl.style.display = "block";
      progressEl.textContent = "WAITING FOR DISCORD...";
    }
  }

  updateMembers();
  setInterval(updateMembers, 30000);
</script>
</body>
</html>
